robot_file: hunter_se_improved.yaml

# Stage 2 / L0: direct Hunter command baseline. Same TQC capacity, reward,
# training budget and arbitrary-subgoal distribution as L1-L5; only the
# policy action representation is [speed, steering].
action_space:
  mode: direct_control

features:
  ackermann_rollout: false
  temporal_context: false
  risk_critic: false
  counterfactual_risk: false

observation:
  robot_state_dim: 7

risk:
  enabled: false

counterfactual:
  enabled: false

scenario: &stage2_scenario
  feasibility_check: ackermann
  world_size_m: 16.0
  min_obstacles: 2
  max_obstacles: 10
  goal_sampling_mode: robot_relative_band
  goal_distance_range_m: [2.0, 6.0]
  goal_direction_sectors_deg: [[-180.0, 180.0]]
  goal_infeasible_fraction: 0.15

training: &stage2_training
  max_timesteps: 150000
  timesteps_before_training: 3000
  eval_freq: 10000
  eval_episodes: 10
  episode_length_steps: 600
  seed: 0
