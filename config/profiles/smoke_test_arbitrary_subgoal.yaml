# Bounded release-smoke profile for the hierarchy-compatible Local policy.
# It keeps the architecture and full-circle/infeasible subgoal contract of
# kinodynamic_tqc_arbitrary_subgoal, but shrinks only the training budget and
# network batch/buffer sizes. NOT a research or promotion profile.
action_space:
  mode: trajectory

features:
  ackermann_rollout: true
  temporal_context: true
  risk_critic: true
  counterfactual_risk: true

observation:
  frame_stack: 4
  robot_state_dim: 8

risk:
  enabled: true
  actor_lambda: 0.1
  actor_penalty_warmup_updates: 3
  min_valid_labels_per_batch: 1

counterfactual:
  enabled: true
  num_candidates: 8
  kappa_offsets_frac: [-1.0, -0.5, 0.5, 1.0]
  speed_fractions: [0.5, 1.0]
  include_stop_candidate: true

hyperparameters:
  batch_size: 8
  buffer_size: 2000
  n_critics: 2

scenario:
  feasibility_check: ackermann
  world_size_m: 16.0
  min_obstacles: 2
  max_obstacles: 10
  goal_sampling_mode: robot_relative_band
  goal_distance_range_m: [2.0, 6.0]
  goal_direction_sectors_deg: [[-180.0, 180.0]]
  goal_infeasible_fraction: 0.15

training:
  max_timesteps: 60
  timesteps_before_training: 12
  eval_freq: 30
  eval_episodes: 1
  episode_length_steps: 30
  seed: 0
