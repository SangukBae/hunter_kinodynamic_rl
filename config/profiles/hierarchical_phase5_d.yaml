robot_file: hunter_se_improved.yaml

# Phase 5 ablation D: + Topological memory -- adds memory.enabled +
# global_rl.topology_feedback_enabled on top of ablation B/C's baseline.
# Local feasibility feedback and global risk feedback stay OFF.

mission:
  position_tolerance_m: 0.6
  heading_tolerance_rad: 3.141592653589793
  require_low_speed_on_goal: true
  goal_speed_threshold_mps: 0.1

localization:
  backend: gazebo_odom
  odom_topic: /odometry
  pose_timeout_sec: 0.5
  minimum_confidence: 0.5
  publish_mission_tf: true

mapping:
  resolution_m: 0.2
  mission_size_cells: 256
  rolling_size_cells: 128
  visit_radius_m: 0.4

hierarchy:
  subgoal_position_tolerance_m: 0.5
  local_option_timeout_steps: 200
  no_progress_window_steps: 40
  no_progress_min_delta_m: 0.1
  consecutive_emergency_stop_limit: 5
  local_risk_threshold: 0.8
  localization_min_confidence: 0.5
  max_retries_per_subgoal: 1
  mission_timeout_steps: 6000

long_horizon_world:
  enabled: true
  size_m: 24.0
  resolution_m: 0.25
  wall_thickness_m: 0.2
  wall_height_m: 1.0
  corridor_width_min_m: 2.0
  corridor_width_max_m: 3.0
  room_count_range: [3, 6]
  dead_end_count_range: [1, 3]
  loop_count_range: [1, 3]
  alternative_route_min_count: 1
  start_goal_geodesic_min_m: 10.0
  require_ackermann_feasibility: true
  generation_attempt_limit: 100
  train_seed_range: [0, 9999]
  validation_seed_range: [10000, 11999]
  test_seed_range: [12000, 13999]

wall_segment_pool:
  enabled: true
  max_segments: 150
  length_classes_m: [2.0, 3.0, 8.0]
  parking_margin_m: 5.0

memory:
  enabled: true
  node_min_distance_m: 2.0
  node_heading_change_rad: 1.0471975511965976
  node_merge_radius_m: 1.0
  max_nodes: 64
  max_nodes_in_observation: 16
  node_recency_norm_steps: 200.0
  free_direction_threshold: 1
  progress_stall_window_steps: 20
  progress_stall_min_delta_m: 0.2
  repeated_estop_limit: 3
  evidence_vote_threshold: 2

feasibility:
  enabled: false
  rollout_sample_count: 8
  clearance_search_radius_m: 2.0
  clearance_norm_m: 2.0
  historical_stats_radius_m: 1.0

global_rl:
  enabled: true
  direction_degrees: [-180.0, -135.0, -90.0, -45.0, 0.0, 45.0, 90.0, 135.0]
  distances_m: [3.0, 6.0]
  fallback_mode: backtrack
  fallback_backtrack_distance_m: 2.0
  rollout_sample_count: 8
  robot_footprint_radius_m: 0.58
  map_crop_size_cells: 96
  goal_distance_norm_m: 30.0
  max_speed_norm_mps: 1.5
  cnn_channels: [16, 32]
  map_feature_dim: 128
  scalar_feature_dim: 32
  candidate_feature_dim: 32
  fused_feature_dim: 128
  replay_capacity: 50000
  batch_size: 64
  gamma: 0.99
  learning_rate: 0.0001
  target_update_interval_steps: 500
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 20000
  warmup_options: 200
  goal_reward: 100.0
  progress_reward_scale: 1.0
  exploration_reward_scale: 0.02
  exploration_reward_clip: 5.0
  revisit_penalty_scale: 0.05
  repeated_deadend_penalty: 5.0
  local_failure_penalty_timeout: 2.0
  local_failure_penalty_no_progress: 2.0
  local_failure_penalty_blocked: 3.0
  local_failure_penalty_high_risk: 4.0
  local_failure_penalty_cancelled_by_replan: 1.0
  risk_penalty_scale: 1.0
  elapsed_penalty_per_local_step: 0.01
  predicted_risk_penalty_scale: 0.0
  include_failure_channel: false
  topology_feedback_enabled: true
  feasibility_feedback_enabled: false
  global_risk_feedback_enabled: false

hierarchical_training:
  enabled: true
  local_checkpoint_dir: "runtime/experiments/local_frozen/checkpoints"
  local_checkpoint_name: "final"
  local_training_profile_name: local_l5_counterfactual
  max_local_steps_per_option: 150
  max_global_options_per_mission: 40
  long_horizon_level: 1
